[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Build-time tasks for Figura Obscura: icon and packaging asset generation."

[dependencies]
image = { workspace = true }
anyhow = { workspace = true }
# `bench` times these directly. The end-to-end run cannot reach the censor
# renderers — a detector finds nothing in generated images — so measuring them
# means calling them.
ob-core = { workspace = true }
ob-censor = { workspace = true }
ob-detect = { workspace = true }

